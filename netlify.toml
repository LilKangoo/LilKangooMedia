# LilKangooMedia Phase 32.1: crawlable OG share links, explicit function rewrites.
[build]
  command = "python3 scripts/build_articles.py && python3 scripts/build_service_pages.py && python3 scripts/phase20_rebuild_sitemap.py && python3 scripts/phase30_apply_theme.py && python3 scripts/build_share_pages.py && python3 scripts/phase33_prepare_seo.py && python3 scripts/phase33_seo_audit.py"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/share/service/:slug"
  to = "/.netlify/functions/link-preview?kind=service&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/share/gallery/:slug"
  to = "/.netlify/functions/link-preview?kind=gallery&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/share/story/:slug"
  to = "/.netlify/functions/link-preview?kind=story&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/share/article/:slug"
  to = "/.netlify/functions/link-preview?kind=article&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/share/page/:slug"
  to = "/.netlify/functions/link-preview?kind=page&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/share/social/:slug"
  to = "/.netlify/functions/link-preview?kind=social&slug=:slug"
  status = 200
  force = false

# Phase 33: Google/AEO public HTML routes; public CMS data only.
# Static SEO service guides and generated article HTML win where a file exists.
[[redirects]]
  from = "/sitemap-live.xml"
  to = "/.netlify/functions/seo-sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/work/:slug"
  to = "/.netlify/functions/seo-entry?kind=story&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/work/:slug/"
  to = "/.netlify/functions/seo-entry?kind=story&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/services/:slug/"
  to = "/.netlify/functions/seo-entry?kind=service&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/articles/:slug"
  to = "/.netlify/functions/seo-entry?kind=article&slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/articles/:slug/"
  to = "/.netlify/functions/seo-entry?kind=article&slug=:slug"
  status = 200
  force = false
