# LilKangooMedia — Netlify build with SEO service pages and shared public theme.
[build]
  command = "python3 scripts/build_articles.py && python3 scripts/build_service_pages.py && python3 scripts/phase20_rebuild_sitemap.py && python3 scripts/phase30_apply_theme.py"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/share/service/:slug"
  to = "/.netlify/functions/link-preview?kind=service&slug=:slug"
  status = 200

[[redirects]]
  from = "/share/gallery/:slug"
  to = "/.netlify/functions/link-preview?kind=gallery&slug=:slug"
  status = 200
